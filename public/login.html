<!-- public/index.html - The Frontend -->
<!DOCTYPE html>
<html>
<head>
  <title>Simple Login</title>
</head>
<body>
  <h1>Login form</h1>
  
  <form id="loginForm">
    <input type="text" id="loginUsername" placeholder="Username" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <div id="loginMessage"></div>

  <h1>Sign-Up Form</h1>

  <form id="signUpForm">
    <input type="text" id="signUpUsername" placeholder="Username" required>
    <input type="email" id="signUpEmail" placeholder="Email" required>
    <input type="password" id="signUpPassword" placeholder="Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div id="signUpMessage"></div>

  <h1>Like Send</h1>
  
  <form id="sendLike">
    <input type="number" id="postId" placeholder="ID of liked post">
    <button type="submit">Like a post</button>    
  </form>

  <div id="Like Message"></div>
  

  <script>

    function getCookie(name) {
      const cookies = document.cookie.split('; ');
      const found = cookies.find(row => row.startsWith(name + '='));
      return found ? found.split('=')[1] : null;
    }

    //login form
    // STEP 1: Listen for form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Prevent page reload
      
      console.log('[DEV_LOG]🌐 Browser: User clicked login button');
      
      // STEP 2: Get the values from the form
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      
      // STEP 3: Send HTTP POST request to backend
      try {
        console.log('[DEV_LOG]🌐 Browser: Sending request to /api/login...');
        
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        console.log('[DEV_LOG]🌐 Browser: Got response from server!');
        
        // STEP 4: Parse the JSON response
        const data = await response.json();
        
        console.log('[DEV_LOG]🌐 Browser: Response data:', data);
        
        // STEP 5: Show result to user
        if (data.success) {
          document.getElementById('loginMessage').textContent = '✅ ' + data.message;
          document.getElementById('loginMessage').style.color = 'green';
          
          //Store token as cookie in a JSON string
          document.cookie = `token=${data.token}; path=/`;
          // Store user data (as JSON string)
          document.cookie = `user=${JSON.stringify(data.user)}; path=/`;
        } else {
          document.getElementById('loginMessage').textContent = '❌ ' + data.message;
          document.getElementById('loginMessage').style.color = 'red';
        }
        
      } catch (error) {
        console.error('[DEV_LOG]🌐 Browser: Error!', error);
        document.getElementById('loginMessage').textContent = '❌ Network error';
      }
    });


    //----------------------------------------------------------------------------------------------//


    //signUp Form
    // STEP 1: Listen for form submission
    document.getElementById('signUpForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Prevent page reload
      
      console.log('🌐 Browser: User clicked login button');
      
      // STEP 2: Get the values from the form
      const username = document.getElementById('signUpUsername').value;
      const email = document.getElementById('signUpEmail').value;
      const password = document.getElementById('signUpPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      console.log('[DEV_LOG]🌐 Browser: Preparing to send:', { username, email, password, confirmPassword });
      
      // STEP 3: Send HTTP POST request to backend
      try {
        console.log('[DEV_LOG]🌐 Browser: Sending request to /api/signup...');
        
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password, confirmPassword })
        });
        
        console.log('[DEV_LOG]🌐 Browser: Got response from server!');
        
        // STEP 4: Parse the JSON response
        const data = await response.json();
        
        console.log('[DEV_LOG]🌐 Browser: Response data:', data);
        
        // STEP 5: Show result to user
        if (data.success) {
          document.getElementById('signUpMessage').textContent = '✅ ' + data.message;
          document.getElementById('signUpMessage').style.color = 'green';
        } else {
          document.getElementById('signUpMessage').textContent = '❌ ' + data.message;
          document.getElementById('signUpMessage').style.color = 'red';
        }
        
      } catch (error) {
        console.error('[DEV_LOG]🌐 Browser: Error!', error);
        document.getElementById('signUpMessage').textContent = '❌ Network error';
      }
    });

    document.getElementById('sendLike').addEventListener('submit', async (e) => {
      e.preventDefault(); // prevents page reset
      
      // STEP 2: Get the values from the form
      const postId = document.getElementById('postId').value;
      const token = getCookie('token');

      console.log('[DEV_LOG]🌐 Browser: User clicked wanted to like post with this number :\"', postId,'\"for id');
      console.log('[DEV_LOG]🌐 Browser: preparing to check jwt token for validity')
      console.log('sending token:', token, 'and postID :', postId)
      try{
        
        console.log('[DEV_LOG]🌐 Browser: Sending request to /api/like...');

        const response = await fetch('/api/like', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ postId, token })
        });


      } catch(error) {
        console.log("[DEV_LOG]🌐 Browser: error happened when user tried to like post", error)
      }
      
    });
  </script>
</body>
</html>
